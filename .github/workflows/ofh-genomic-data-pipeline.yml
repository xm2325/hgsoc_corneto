name: genomic-data-engineering

on:
  push:
    branches: ["ofh-genomic-data-engineering"]
    paths:
      - "ofh_genomic_data_engineering/**"
      - ".github/workflows/ofh-genomic-data-pipeline.yml"
  pull_request:
    paths:
      - "ofh_genomic_data_engineering/**"
      - ".github/workflows/ofh-genomic-data-pipeline.yml"
  workflow_dispatch:

jobs:
  unit-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ofh_genomic_data_engineering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package and tests
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: pytest -q
      - name: Install bcftools
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools unzip
          bcftools --version | head -n 1
      - name: Install pinned PLINK2
        run: |
          curl -fsSL -o /tmp/plink2.zip https://www.cog-genomics.org/static/bin/plink2.0.0-a.6.9_linux_avx2.zip
          unzip -q /tmp/plink2.zip -d /tmp/plink2
          sudo install -m 0755 /tmp/plink2/plink2 /usr/local/bin/plink2
          plink2 --version
      - name: Install pinned Nextflow
        env:
          NXF_VER: "26.04.6"
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo install -m 0755 nextflow /usr/local/bin/nextflow
          nextflow -version
      - name: Run real 1000 Genomes pipeline
        run: nextflow run main.nf -profile ci
      - name: Validate deliverables, query layer and release contract
        run: |
          test -s results/05_bgen/analysis_ready.bgen
          test -s results/06_parquet/summary.json
          test -s results/06_parquet/schema_manifest.json
          test -s results/06_parquet/query_validation.json
          test -s results/07_provenance/provenance.json
          test -s results/08_release/release_validation.json
          test "$(find results/06_parquet/parquet -name '*.parquet' -size +0c | wc -l)" -eq 7
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('results/01_normalised/source_inventory.json').read_text())
          summary = json.loads(Path('results/06_parquet/summary.json').read_text())
          schema = json.loads(Path('results/06_parquet/schema_manifest.json').read_text())
          query = json.loads(Path('results/06_parquet/query_validation.json').read_text())
          provenance = json.loads(Path('results/07_provenance/provenance.json').read_text())
          release = json.loads(Path('results/08_release/release_validation.json').read_text())

          assert summary['sample_count'] == source['sample_count']
          assert 0 < summary['variant_count'] <= source['variant_count']
          assert summary['storage'] == {'format': 'parquet', 'compression': 'zstd'}
          variant_types = {c['name']: c['type'] for c in schema['tables']['variants']['columns']}
          afreq_types = {c['name']: c['type'] for c in schema['tables']['allele_frequencies']['columns']}
          assert variant_types['POS'] == 'int64', variant_types
          assert afreq_types['ALT_FREQS'] == 'double', afreq_types
          assert query['status'] == 'PASS', query
          assert query['total_variants'] == summary['variant_count']
          assert query['region_query']['matched_variants'] > 0
          assert provenance['products']['schema_manifest.json']['bytes'] > 0
          assert provenance['products']['query_validation.json']['bytes'] > 0
          assert release['status'] == 'PASS', release
          assert all(check['status'] == 'PASS' for check in release['checks'])

          print(json.dumps({
              'input_samples': source['sample_count'],
              'output_samples': summary['sample_count'],
              'variants_before_qc': source['variant_count'],
              'variants_after_qc': summary['variant_count'],
              'duckdb_version': query['engine']['version'],
              'query_region': query['region_query'],
              'release_id': release['release_id'],
              'release_checks': len(release['checks']),
          }, indent=2))
          PY
      - name: Snapshot deterministic release outputs
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = [
              Path('results/05_bgen/analysis_ready.bgen'),
              Path('results/05_bgen/analysis_ready.sample'),
              Path('results/06_parquet/summary.json'),
              Path('results/06_parquet/schema_manifest.json'),
              Path('results/06_parquet/query_validation.json'),
              Path('results/07_provenance/provenance.json'),
              Path('results/08_release/release_validation.json'),
              *sorted(Path('results/06_parquet/parquet').glob('*.parquet')),
          ]

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          snapshot = {str(path): sha256(path) for path in paths}
          Path('/tmp/genomic-release-before.json').write_text(
              json.dumps(snapshot, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Verify deterministic Nextflow resume
        run: |
          nextflow run main.nf -profile ci -resume -with-trace resume-trace.tsv
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/genomic-release-before.json').read_text())

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          after = {name: sha256(Path(name)) for name in before}
          changed = sorted(name for name in before if before[name] != after[name])
          assert not changed, {'changed_outputs': changed}

          with Path('resume-trace.tsv').open(newline='') as fh:
              rows = list(csv.DictReader(fh, delimiter='\t'))
          assert len(rows) == 11, {'trace_rows': len(rows), 'rows': rows}
          statuses = {row['status'] for row in rows}
          assert statuses == {'CACHED'}, {'statuses': sorted(statuses)}

          release = json.loads(Path('results/08_release/release_validation.json').read_text())
          evidence = {
              'status': 'PASS',
              'cached_processes': len(rows),
              'release_id': release['release_id'],
              'tracked_output_count': len(after),
              'changed_outputs': changed,
              'tracked_sha256': after,
          }
          Path('results/08_release/reproducibility_validation.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps({
              'cached_processes': len(rows),
              'tracked_output_count': len(after),
              'release_id': release['release_id'],
          }, indent=2))
          PY
      - name: Build Docker image
        run: docker build -t genomic-data-engineering:test .
      - uses: actions/upload-artifact@v4
        with:
          name: genomic-data-engineering-results
          path: ofh_genomic_data_engineering/results/
