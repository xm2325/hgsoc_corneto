name: genomic-data-engineering

on:
  push:
    branches: ["ofh-genomic-data-engineering"]
    paths:
      - "ofh_genomic_data_engineering/**"
      - ".github/workflows/ofh-genomic-data-pipeline.yml"
  pull_request:
    paths:
      - "ofh_genomic_data_engineering/**"
      - ".github/workflows/ofh-genomic-data-pipeline.yml"
  workflow_dispatch:

jobs:
  unit-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ofh_genomic_data_engineering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package and tests
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: pytest -q
      - name: Install bcftools
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools unzip
          bcftools --version | head -n 1
      - name: Install pinned PLINK2
        run: |
          curl -fsSL -o /tmp/plink2.zip https://www.cog-genomics.org/static/bin/plink2.0.0-a.6.9_linux_avx2.zip
          unzip -q /tmp/plink2.zip -d /tmp/plink2
          sudo install -m 0755 /tmp/plink2/plink2 /usr/local/bin/plink2
          plink2 --version
      - name: Install pinned Nextflow
        env:
          NXF_VER: "26.04.6"
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo install -m 0755 nextflow /usr/local/bin/nextflow
          nextflow -version
      - name: Run real 1000 Genomes pipeline
        run: nextflow run main.nf -profile ci
      - name: Validate delivery, BGEN round-trip, semantic identity, query layer and release contract
        run: |
          test -s results/00_source/delivery_validation.json
          test -s results/05_bgen/analysis_ready.bgen
          test -s results/05_bgen/bgen_validation.json
          test -s results/06_parquet/summary.json
          test -s results/06_parquet/schema_manifest.json
          test -s results/06_parquet/query_validation.json
          test -s results/07_provenance/provenance.json
          test -s results/08_release/release_validation.json
          test "$(find results/06_parquet/parquet -name '*.parquet' -size +0c | wc -l)" -eq 7
          python - <<'PY'
          import json
          from pathlib import Path
          delivery = json.loads(Path('results/00_source/delivery_validation.json').read_text())
          source = json.loads(Path('results/01_normalised/source_inventory.json').read_text())
          bgen = json.loads(Path('results/05_bgen/bgen_validation.json').read_text())
          summary = json.loads(Path('results/06_parquet/summary.json').read_text())
          schema = json.loads(Path('results/06_parquet/schema_manifest.json').read_text())
          query = json.loads(Path('results/06_parquet/query_validation.json').read_text())
          provenance = json.loads(Path('results/07_provenance/provenance.json').read_text())
          release = json.loads(Path('results/08_release/release_validation.json').read_text())
          assert delivery['status'] == 'PASS' and delivery['action'] == 'PROCESS' and delivery['should_process'] is True
          assert delivery['delivery']['reference_genome'] == 'GRCh37'
          assert delivery['source_observed']['sha256'] == 'a02964f209a2bd7e90ed7b70765326d0f548d7d92aa2a46e17db7ba5c7ad8a4d'
          assert delivery['source_observed']['sample_count'] == 90
          assert delivery['source_observed']['sample_ids_sha256'] == '445e93d98883cc9ec183c882566321bc92e037f56f02a4dbdbb526eb1776e34b'
          assert bgen['status'] == 'PASS' and bgen['contract'] == 'bgen-1.2-roundtrip'
          assert bgen['allele_convention'] == 'ref-first' and bgen['probability_bits'] == 16
          assert bgen['sample_count'] == 90 and bgen['variant_count'] == 127171
          assert bgen['max_abs_alt_frequency_diff'] <= bgen['frequency_tolerance'] == 0.0001
          assert len(bgen['sample_ids_sha256']) == 64 and len(bgen['variant_identity_sha256']) == 64
          assert summary['sample_count'] == source['sample_count'] == 90
          assert summary['variant_count'] == 127171
          assert 0 < summary['variant_count'] <= source['variant_count']
          assert summary['storage'] == {'format': 'parquet', 'compression': 'zstd'}
          assert len(summary['semantic_hashes']) == 7 and all(len(value) == 64 for value in summary['semantic_hashes'].values())
          variant_types = {c['name']: c['type'] for c in schema['tables']['variants']['columns']}
          afreq_types = {c['name']: c['type'] for c in schema['tables']['allele_frequencies']['columns']}
          assert variant_types['POS'] == 'int64' and afreq_types['ALT_FREQS'] == 'double'
          assert query['status'] == 'PASS' and query['total_variants'] == summary['variant_count'] and query['region_query']['matched_variants'] > 0
          fingerprint = delivery['delivery']['delivery_fingerprint']
          assert provenance['delivery']['delivery_fingerprint'] == fingerprint
          assert provenance['delivery']['delivery_id'] == delivery['delivery']['delivery_id']
          assert provenance['delivery']['reference_genome'] == 'GRCh37'
          assert provenance['bgen_roundtrip'] == bgen
          assert provenance['parameters']['plink_seed'] == 20260826
          assert provenance['parameters']['plink_threads'] == 2
          assert provenance['parameters']['plink_memory_mb'] == 3000
          assert release['status'] == 'PASS' and release['release_identity']['version'] == 3
          assert release['release_identity']['basis']['semantic_hashes'] == summary['semantic_hashes']
          assert release['release_identity']['basis']['bgen_contract']['allele_convention'] == 'ref-first'
          assert release['release_identity']['basis']['parameters']['plink_seed'] == 20260826
          assert release['release_identity']['basis']['parameters']['plink_threads'] == 2
          assert release['release_identity']['basis']['parameters']['plink_memory_mb'] == 3000
          assert all(check['status'] == 'PASS' for check in release['checks'])
          print(json.dumps({'delivery_fingerprint': fingerprint, 'input_samples': source['sample_count'], 'output_samples': summary['sample_count'], 'variants_before_qc': source['variant_count'], 'variants_after_qc': summary['variant_count'], 'bgen_max_abs_alt_frequency_diff': bgen['max_abs_alt_frequency_diff'], 'semantic_hash_count': len(summary['semantic_hashes']), 'plink_seed': provenance['parameters']['plink_seed'], 'plink_threads': provenance['parameters']['plink_threads'], 'plink_memory_mb': provenance['parameters']['plink_memory_mb'], 'release_identity_version': release['release_identity']['version'], 'release_id': release['release_id'], 'release_checks': len(release['checks'])}, indent=2))
          PY
      - name: Snapshot exact release bytes before cache resume
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          paths = [Path('results/00_source/delivery_validation.json'), Path('results/05_bgen/analysis_ready.bgen'), Path('results/05_bgen/analysis_ready.sample'), Path('results/05_bgen/bgen_validation.json'), Path('results/06_parquet/summary.json'), Path('results/06_parquet/schema_manifest.json'), Path('results/06_parquet/query_validation.json'), Path('results/07_provenance/provenance.json'), Path('results/08_release/release_validation.json'), *sorted(Path('results/06_parquet/parquet').glob('*.parquet'))]
          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b''): h.update(chunk)
              return h.hexdigest()
          Path('/tmp/genomic-release-before.json').write_text(json.dumps({str(path): sha256(path) for path in paths}, indent=2, sort_keys=True) + '\n')
          PY
      - name: Verify exact Nextflow cache-resume reproducibility
        run: |
          nextflow run main.nf -profile ci -resume -with-trace resume-trace.tsv
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          before = json.loads(Path('/tmp/genomic-release-before.json').read_text())
          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b''): h.update(chunk)
              return h.hexdigest()
          after = {name: sha256(Path(name)) for name in before}
          changed = sorted(name for name in before if before[name] != after[name])
          assert not changed, {'changed_outputs': changed}
          with Path('resume-trace.tsv').open(newline='') as fh: rows = list(csv.DictReader(fh, delimiter='\t'))
          assert len(rows) == 13 and {row['status'] for row in rows} == {'CACHED'}
          release = json.loads(Path('results/08_release/release_validation.json').read_text())
          delivery = json.loads(Path('results/00_source/delivery_validation.json').read_text())
          bgen = json.loads(Path('results/05_bgen/bgen_validation.json').read_text())
          evidence = {'status': 'PASS', 'contract': 'exact-cache-resume-bytes', 'cached_processes': len(rows), 'release_id': release['release_id'], 'release_identity_version': release['release_identity']['version'], 'delivery_fingerprint': delivery['delivery']['delivery_fingerprint'], 'bgen_variant_identity_sha256': bgen['variant_identity_sha256'], 'tracked_output_count': len(after), 'changed_outputs': changed, 'tracked_sha256': after}
          Path('results/08_release/reproducibility_validation.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          PY
      - name: Build Docker image
        run: docker build -t genomic-data-engineering:test .
      - name: Run containerised real-data pipeline
        run: |
          rm -rf container-results
          mkdir -p container-results
          docker run --rm -v "$PWD/container-results:/work/results" genomic-data-engineering:test
          python scripts/validate_runtime_equivalence.py --host-results results --candidate-results container-results --expected-samples 90 --expected-variants 127171 --output results/08_release/runtime_equivalence_validation.json
          cat results/08_release/runtime_equivalence_validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: genomic-data-engineering-results
          path: ofh_genomic_data_engineering/results/
