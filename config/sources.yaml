rna_reference:
  genome: GRCh38
  annotation: GENCODE v32
  reason: >-
    Tighe et al. mapped the OCM studies to hg38/GENCODE v32. A single
    GENCODE-v32 transcriptome/decoy reference is therefore used for Salmon
    harmonisation across all four accessions.
  note: >-
    Salmon harmonisation is an independent reproduction choice; the Tighe paper
    itself used STAR --quantMode GeneCounts and DESeq2 median-of-ratios.
